version: '3.8'

services:
  # Authoritative Decision Engine Backend
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: resilience-os-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Decision Intelligence Frontend UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resilience-os-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: resilience-os-net
